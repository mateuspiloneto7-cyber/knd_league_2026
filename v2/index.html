<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KND League</title>
<meta name="description" content="Placar e estatisticas da KND League.">
<meta name="theme-color" content="#0f131b">
<link rel="icon" href="assets/liga.png">
<!-- O ?v= no fim e obrigatorio: sem ele o navegador serve o css/js velho do cache
     mesmo depois de publicar. O numero sobe a cada deploy (scripts/publicar.py). -->
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>

<div class="wrap">

  <div class="brand"><img id="brandLogo" src="assets/liga.png" alt="KND League"></div>

  <div class="top"><div class="comp" id="comp"></div></div>

  <div class="match">
    <div class="team a">
      <div class="logo" id="logoA"></div>
      <div class="tname" id="nameA"></div>
    </div>
    <div class="score">
      <div class="snum" id="scoreA">0</div>
      <div class="vs">&times;</div>
      <div class="snum" id="scoreB">0</div>
    </div>
    <div class="team b">
      <div class="logo" id="logoB"></div>
      <div class="tname" id="nameB"></div>
    </div>
  </div>

  <div class="sec-label">Semanas</div>
  <div class="weeks" id="weeks"></div>

  <div class="sec-label" id="statsLabel"></div>
  <div class="stats">
    <div class="tpanel a"><h3 id="stTitleA"></h3><div id="statsA"></div></div>
    <div class="tpanel b"><h3 id="stTitleB"></h3><div id="statsB"></div></div>
  </div>

  <div class="sec-label">MVP da semana <span class="hint" id="mvpWeekHint"></span></div>
  <div id="mvpWeek"></div>

  <div class="sec-label">MVP semana a semana</div>
  <div class="mvp-strip" id="mvpStrip"></div>

  <div class="sec-label">Ranking da season
    <span class="hint">Rating KND: 1.00 é o jogador médio da liga</span></div>
  <div class="tpanel" id="ranking"></div>

  <div class="sec-label">MVP da série</div>
  <div id="mvp" class="mvpcard"></div>

  <div class="sec-label" id="sponsorLabel">Patrocinador</div>
  <div id="sponsor"></div>

</div>

<div id="mapModal" class="mapmodal" hidden>
  <div class="mm-backdrop" onclick="closeMapModal()"></div>
  <div class="mm-panel" id="mmPanel"></div>
</div>

<script src="app.js?v=7"></script>
</body>
</html>
